<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">

<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">

<meta name="apple-mobile-web-app-title" content="DX7 Lecteur">
<title>Lecteur DX7 (moteur Dexed)</title>
<style>
:root{--bg:#f6f4ef;--fg:#1d1c1a;--mut:#7a766d;--card:#fff;--line:#ddd8cc;--acc:#b5532c;--sel:#f3e2d8;--wk:#fbfaf7;--bk:#1d1c1a}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171618;--fg:#ece8df;--mut:#9a958a;--card:#222024;--line:#38353b;--acc:#e0875a;--sel:#3a2a22;--wk:#d9d5cb;--bk:#0c0b0d}}
:root[data-theme="dark"]{--bg:#171618;--fg:#ece8df;--mut:#9a958a;--card:#222024;--line:#38353b;--acc:#e0875a;--sel:#3a2a22;--wk:#d9d5cb;--bk:#0c0b0d}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column}
header{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
h1{font-size:16px;margin:0 8px 0 0}
h2{font-size:13px;margin:0;padding:8px 10px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line);color:var(--mut);font-weight:600}
h2 .t{margin-left:auto;display:flex;gap:4px}
select{font:inherit;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:3px}
button,.btn{font:inherit;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:4px 9px;cursor:pointer}
button:hover,.btn:hover{border-color:var(--acc)}
.acc{background:var(--acc);color:#fff;border-color:var(--acc)}
#st{color:var(--mut);font-size:12px;flex:1;min-width:120px}
#info{width:100%;color:var(--mut);font-size:12px}
main{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px 12px}
section{background:var(--card);border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column;min-height:0}
.list{overflow:auto;flex:1}
.bh{position:sticky;top:0;background:var(--card);padding:6px 10px;font-weight:600;display:flex;gap:6px;align-items:center;border-bottom:1px solid var(--line)}
.bh span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r{display:flex;align-items:center;gap:6px;padding:3px 10px;border-bottom:1px solid var(--line);cursor:pointer}
.r:hover{background:var(--sel)}.r.sel{background:var(--sel);box-shadow:inset 3px 0 var(--acc)}
.n{color:var(--mut);width:22px;text-align:right;font-variant-numeric:tabular-nums}
.nm{flex:1;font-family:ui-monospace,Menlo,monospace;white-space:pre}
.r input{flex:1;min-width:0;font:12px ui-monospace,Menlo,monospace;background:transparent;color:var(--fg);border:1px solid transparent;border-radius:4px;padding:2px 4px}
.r input:focus{border-color:var(--acc);outline:none}
.sm{padding:1px 7px}.e{color:var(--mut)}
.chip{padding:2px 10px;border-radius:12px;font-size:12px}.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.dot{font-size:8px;color:var(--line)}.dot.on{color:var(--acc)}
.rt{color:var(--acc);font-size:12px;min-width:26px}
.tg{color:var(--mut);font-size:11px;max-width:32%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#insp{padding:8px 12px;border-top:1px solid var(--line);max-height:34vh;overflow:auto}
.ih{display:flex;gap:10px;align-items:baseline;margin-bottom:6px}.ih b{font-family:ui-monospace,Menlo,monospace}.ih span{color:var(--mut);font-size:12px}
.ir{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-bottom:6px}
.step{display:flex;align-items:center;gap:4px}.step button{width:46px;height:42px;font-size:24px;padding:0}
.step span{min-width:38px;text-align:center;font-size:22px;font-weight:700}
#stars span{font-size:24px;cursor:pointer;color:var(--acc);padding:0 1px}
#tags{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
#tags input,#cm{font:inherit;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:4px 8px}
#cm{flex:1;min-width:160px}
footer{padding:8px 12px 10px;border-top:1px solid var(--line)}
.oct{display:flex;gap:6px;align-items:center;margin-bottom:6px;color:var(--mut);font-size:12px}
#kb{position:relative;display:flex;height:110px;touch-action:none;user-select:none;-webkit-user-select:none}
.k{flex:1;background:var(--wk);border:1px solid #777;border-radius:0 0 5px 5px}
.k.on{background:var(--acc)}
.b{position:absolute;top:0;width:5.4%;height:62%;transform:translateX(-50%);background:var(--bk);border-radius:0 0 4px 4px;z-index:2}
.b.on{background:var(--acc)}
@media(max-width:700px){main{grid-template-columns:1fr;grid-template-rows:1fr 1fr}#kb{height:90px}}
</style></head><body>
<header>
 <h1>Lecteur DX7 · moteur Dexed</h1>
 <label class="btn acc">Ouvrir des .syx<input id="f" type="file" multiple hidden></label>
 <button id="demo">▶ Accords</button>
 <select id="xs" title="Contenu de l'export"><option value="annot">Export : annotées</option><option value="all">Export : toutes les écoutées</option></select><button id="xj" class="acc">⇩ Notes (JSON)</button>
 <button id="inst" hidden>⬇ Installer</button>
 <button id="midi">🎹 Activer MIDI</button>
 <label>Vol <input id="vol" type="range" min="0" max="100" value="70"></label>
 <label id="el" hidden>Moteur <select id="eng"><option value="0">Dexed moderne</option><option value="1">Dexed vintage (MkI)</option></select></label>
 <span id="ei" style="color:var(--mut);font-size:12px"></span>
 <span id="mi" style="color:var(--mut);font-size:12px"></span>
 <span id="st">Charge un ou plusieurs fichiers .syx (banques de 32 voix).</span>
 <div id="info"></div>
</header>
<main>
 <section><h2>Banques <select id="fs"><option value="all">Toutes</option><option value="new">Jamais écoutées</option><option value="heard">Écoutées</option><option value="unrated">Non notées</option><option value="r3">Note ≥ 3</option><option value="r4">Note ≥ 4</option><option value="r5">Note 5</option></select><select id="ft"></select></h2><div id="src" class="list"></div></section>
 <section><h2>Ma carte <input id="cname" type="text" maxlength="24" value="Ma carte" title="Nom de la carte (nom du fichier exporté)" style="font:inherit;width:120px;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:2px 6px"><span id="cn"></span><span class="t"><button id="sort">A→Z</button><button id="clr">Vider</button><button id="exp" class="acc">Exporter</button></span></h2><div id="cart" class="list"></div></section>
</main>
<div id="insp" hidden>
 <div class="ih"><b id="in"></b><span id="im"></span></div>
 <div class="ir"><div class="step"><button id="rm" title="Note −">−</button><span id="rv">–</span><button id="rp" title="Note +">+</button></div><span id="stars"></span><input id="cm" type="text" maxlength="200" placeholder="Commentaire…"></div>
 <div id="tags"></div>
</div>
<footer>
 <div class="oct"><button id="om">−</button><span id="ol"></span><button id="op">+</button><span>· flèches ↑↓ : voix suivante / précédente · touches A Z E R… : clavier</span></div>
 <div id="kb"></div>
</footer>
<script>
const $=id=>document.getElementById(id);
const AL=["13/21 65 54 43/6","13/21 65 54 43/2","14/32 21 65 54/6","14/32 21 65 54/6","135/21 43 65/6","135/21 43 65/6","13/21 43 53 65/6","13/21 43 53 65/4","13/21 43 53 65/2","14/32 21 54 64/3","14/32 21 54 64/6","13/21 43 53 63/2","13/21 43 53 63/6","13/21 43 54 64/6","13/21 43 54 64/2","1/21 31 51 43 65/6","1/21 31 51 43 65/2","1/21 31 41 54 65/3","145/21 32 64 65/6","124/31 32 54 64/3","1245/31 32 64 65/3","1345/21 63 64 65/6","1245/32 64 65/6","12345/63 64 65/6","12345/64 65/6","124/32 54 64/6","124/32 54 64/3","136/21 43 54/5","1235/43 65/6","1236/43 54/5","12345/65/6","123456//6"].map(s=>{const[c,m,f]=s.split('/'),inp=[[],[],[],[],[],[]];m.split(' ').filter(Boolean).forEach(x=>inp[x[1]-1].push(x[0]-1));return{car:[...c].map(x=>x-1),inp,fb:f-1}});

/* ---------- moteur FM ---------- */
let ac=null,sr=44100,vol=.7,voices=[],cur=null,base=48,WI=null,W=null,curB=null,lpB=null;
function useW(){if(WI&&!W&&ac){WI.engine_init(ac.sampleRate);W=WI;WI.engine_set(+$('eng').value)}}
function parse(b){const ops=[];for(let k=0;k<6;k++){const o=b.subarray(k*17,k*17+17);ops[5-k]={r:[o[0],o[1],o[2],o[3]],l:[o[4],o[5],o[6],o[7]],bp:o[8],ld:o[9],rd:o[10],lc:o[11]&3,rc:(o[11]>>2)&3,rs:o[12]&7,det:(o[12]>>3)&15,ams:o[13]&3,kvs:(o[13]>>2)&7,ol:o[14],fx:o[15]&1,c:(o[15]>>1)&31,f:o[16]}}
 return{ops,algo:b[110]&31,fb:b[111]&7,lfoHz:.1+50*Math.pow(b[112]/99,2.2),amd:b[115]}}
function init(){if(ac){if(ac.state!=='running')ac.resume();return}
 ac=new(window.AudioContext||window.webkitAudioContext)();sr=ac.sampleRate;
 const sp=ac.createScriptProcessor(512,0,2);
 sp.onaudioprocess=e=>{const L=e.outputBuffer.getChannelData(0),R=e.outputBuffer.getChannelData(1);
  if(W){W.render(L.length);const q=new Float32Array(W.memory.buffer,W.out_buf(),L.length);for(let i=0;i<L.length;i++){const x=Math.tanh(q[i]*vol*2.2);L[i]=x;R[i]=x}return}
  L.fill(0);
  for(let k=voices.length-1;k>=0;k--)if(!render(voices[k],L))voices.splice(k,1);
  for(let i=0;i<L.length;i++){const x=Math.tanh(L[i]*vol*.6);L[i]=x;R[i]=x}};
 sp.connect(ac.destination);ac.resume()}
function on(n,vel){init();useW();if(!cur)return;
 if(W){if(lpB!==curB){new Uint8Array(W.memory.buffer,W.patch_buf(),128).set(curB);W.patch_load();lpB=curB}W.note_on(n,vel);return}
 off(n);if(voices.length>=10)voices.shift();
 const p=cur,f0=440*Math.pow(2,(n-69)/12);
 const v={n,p,rel:false,t:0,rt:0,lfo:0,ph:new Float64Array(6),inc:new Float64Array(6),amps:new Float64Array(6),out:new Float64Array(6),f1:0,fa:0,fbk:Math.pow(2,p.fb-7)*.25,o:[]};
 p.ops.forEach((O,i)=>{
  let fr=O.fx?Math.pow(10,(O.c&3)+O.f/100):(O.c||.5)*(1+O.f/100)*f0;
  fr*=Math.pow(2,(O.det-7)*1.5/1200);v.inc[i]=fr/sr;
  let L=O.ol+O.kvs*(vel-72)/127*10;
  const d=n-(O.bp+21),left=d<0,dep=left?O.ld:O.rd,cv=left?O.lc:O.rc,g=Math.abs(d)/3,lin=cv===0||cv===3;
  L+=(cv<2?-1:1)*dep*.08*(lin?g:g*g/10);L=Math.max(0,Math.min(99,L));
  const ra=O.rs*(n-36)/10;
  v.o.push({c:O.l[3],st:0,ol:L,a:0,spd:O.r.map(r=>.45*Math.pow(2,Math.min(99,Math.max(0,r+ra))*41/64/4))});
 });voices.push(v)}
function off(n){if(W){W.note_off(n);return}voices.forEach(v=>{if(v.n===n&&!v.rel){v.rel=true;v.rt=v.t;v.o.forEach(o=>{if(o.st!==5)o.st=3})}})}
function render(v,out){const p=v.p,A=AL[p.algo],S=32,dt=S/sr,o6=v.out,ph=v.ph,inc=v.inc,am=v.amps;
 for(let b=0;b<out.length;b+=S){
  v.t+=dt;v.lfo+=p.lfoHz*dt;const lf=.5+.5*Math.sin(6.2831853*v.lfo);
  for(let i=0;i<6;i++){const o=v.o[i],O=p.ops[i];
   if(o.st<4){const tg=O.l[o.st],d=tg-o.c,s=o.spd[o.st]*dt;
    if(Math.abs(d)<=s){o.c=tg;if(o.st===2)o.st=4;else if(o.st===3)o.st=5;else o.st++}else o.c+=d>0?s:-s}
   let a=o.c<=0?0:Math.pow(2,(o.ol+o.c-198)/8);if(o.c<1)a*=o.c;
   if(O.ams&&p.amd)a*=1-(p.amd/99)*(O.ams/3)*lf;am[i]=a}
  if(v.rel){let d=true;for(const c of A.car){const o=v.o[c];if(o.st!==5&&o.c>.5)d=false}if(d||v.t-v.rt>12)return false}
  for(let s=0;s<S;s++){
   for(let i=5;i>=0;i--){let m=0;const ip=A.inp[i];for(let k=0;k<ip.length;k++)m+=o6[ip[k]];
    if(i===A.fb&&p.fb)m+=v.fa*v.fbk;
    ph[i]+=inc[i];if(ph[i]>=1)ph[i]-=1;
    o6[i]=Math.sin(6.2831853*ph[i]+m*12.566)*am[i];
    if(i===A.fb){v.fa=(v.f1+o6[i])*.5;v.f1=o6[i]}}
   let sum=0;for(const c of A.car)sum+=o6[c];out[b+s]+=sum}}
 return true}

/* ---------- données ---------- */
const nm=b=>String.fromCharCode(...b.subarray(118,128)).replace(/[^\x20-\x7e]/g,' ').trimEnd();
const banks=[];let cart=Array(32).fill(null),selKey='';
try{const s=JSON.parse(localStorage.getItem('dx7cart')||'null');if(s)cart=s.map(a=>a?new Uint8Array(a):null)}catch(e){}
const persist=()=>{try{localStorage.setItem('dx7cart',JSON.stringify(cart.map(b=>b?Array.from(b):null)))}catch(e){}};
/* ---------- notes, tags, journal d'écoute ---------- */
const BASE=['Rhodes','Wurlitzer','Clav','Piano','Orgue','Synth','Polysynth','Lead','Basse','Pad','Cloche','Cordes','Cuivres','Pluck','FX'];
const hex=b=>Array.from(b,x=>x.toString(16).padStart(2,'0')).join('');
const unhex=t=>Uint8Array.from(t.match(/../g),x=>parseInt(x,16));
function fp(b){let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0;i<128;i++){const c=(i>=118)?0:b[i];h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}
 h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
 return(4294967296*(2097151&h2)+(h1>>>0)).toString(16)}
const IDM=new WeakMap(),idOf=b=>{let i=IDM.get(b);if(!i){i=fp(b);IDM.set(b,i)}return i};
let meta={};try{meta=JSON.parse(localStorage.getItem('dx7meta')||'{}')||{}}catch(e){meta={}}
const persistMeta=()=>{try{localStorage.setItem('dx7meta',JSON.stringify(meta))}catch(e){}};
const mk=b=>({h:hex(b),nm:nm(b),r:0,t:[],c:'',n:0,f:0,l:0,s:[]});
const getRec=b=>meta[idOf(b)]||(meta[idOf(b)]=mk(b));
const flt={st:'all',tag:''};
function pass(r){const s=flt.st;
 if(s==='new'&&r&&r.n)return false;if(s==='heard'&&!(r&&r.n))return false;if(s==='unrated'&&r&&r.r)return false;
 if(s[0]==='r'&&!(r&&r.r>=+s[1]))return false;if(flt.tag&&!(r&&r.t.includes(flt.tag)))return false;return true}
const allTags=()=>[...new Set([...BASE,...Object.values(meta).flatMap(r=>r.t)])];
function touch(b,key){const r=getRec(b),t=Date.now();r.n++;if(!r.f)r.f=t;r.l=t;r.nm=nm(b);r.h=hex(b);
 if(key&&key[0]==='s'){const bn=banks[+key.slice(1).split(':')[0]];if(bn&&!bn.name.startsWith('Journal')&&!r.s.includes(bn.name)&&r.s.length<8)r.s.push(bn.name)}
 persistMeta()}
function rate(v){if(!curB)return;const r=getRec(curB);r.r=Math.max(0,Math.min(5,v));persistMeta();drawInsp();drawAll()}
function toggleTag(t){const r=getRec(curB);r.t=r.t.includes(t)?r.t.filter(x=>x!==t):[...r.t,t];persistMeta();drawInsp();drawAll()}
function drawTagFilter(){const s=$('ft'),v=flt.tag;s.textContent='';const o0=h('option',null,'Tous les tags');o0.value='';s.append(o0);
 allTags().forEach(t=>{const o=h('option',null,t);o.value=t;s.append(o)});s.value=v}
function drawInsp(){const I=$('insp');if(!curB){I.hidden=true;return}I.hidden=false;const r=getRec(curB);
 $('in').textContent=nm(curB);$('im').textContent='écoutée '+r.n+'×'+(r.f?' · 1re fois le '+new Date(r.f).toLocaleDateString('fr-FR'):'');
 $('rv').textContent=r.r||'–';const st=$('stars');st.textContent='';
 for(let k=1;k<=5;k++){const x=h('span',null,k<=r.r?'★':'☆');x.onclick=()=>rate(k);st.append(x)}
 if($('cm')!==document.activeElement)$('cm').value=r.c;
 const T=$('tags');T.textContent='';
 allTags().forEach(t=>{const b=h('button','chip'+(r.t.includes(t)?' on':''),t);b.onclick=()=>toggleTag(t);T.append(b)});
 const ni=h('input');ni.type='text';ni.placeholder='+ tag perso (Entrée)';ni.maxLength=20;
 ni.onkeydown=e=>{if(e.key==='Enter'&&ni.value.trim()){const t=ni.value.trim();if(!r.t.includes(t))r.t.push(t);persistMeta();drawInsp();drawAll()}};T.append(ni)}
$('rm').onclick=()=>rate((curB?getRec(curB).r:0)-1);$('rp').onclick=()=>rate((curB?getRec(curB).r:0)+1);
$('cm').onchange=e=>{if(curB){getRec(curB).c=e.target.value;persistMeta()}};
$('fs').onchange=e=>{flt.st=e.target.value;drawSrc()};$('ft').onchange=e=>{flt.tag=e.target.value;drawSrc()};
/* ---- FORMAT D'EXPORT : tout se règle ici (adapter à la spec du plugin) ---- */
function buildExport(scope){const iso=t=>t?new Date(t).toISOString():null,inCart=new Set(cart.filter(Boolean).map(idOf));
 cart.forEach(b=>b&&getRec(b));
 const presets=Object.entries(meta).filter(([id,r])=>scope==='all'?r.n||r.r||r.t.length||r.c:(r.r||r.t.length||r.c||inCart.has(id)))
  .map(([id,r])=>({id,name:r.nm,syx:r.h,rating:r.r||null,tags:r.t,comment:r.c||'',listens:r.n,firstListened:iso(r.f),lastListened:iso(r.l),sources:r.s}));
 return{format:'dx7-library',version:1,exported:new Date().toISOString(),
  voiceFormat:'DX7 32-voice bulk dump, one voice = 128 packed bytes, hex (name = last 10 bytes)',
  presets,cartridges:[{name:$('cname').value||'Ma carte',slots:cart.map(b=>b?idOf(b):null)}]}}
function importJSON(txt,fname){let j;try{j=JSON.parse(txt)}catch(e){status('JSON illisible.');return}
 if(!j||!Array.isArray(j.presets)){status('JSON non reconnu (champ « presets » absent).');return}
 const v=[];for(const p of j.presets){if(!p.syx||p.syx.length!==256)continue;const b=unhex(p.syx),id=fp(b),old=meta[id],l=p.lastListened?Date.parse(p.lastListened):0;
  if(!old||l>=(old.l||0))meta[id]=Object.assign(mk(b),{r:p.rating||0,t:p.tags||[],c:p.comment||'',n:Math.max(p.listens||0,old?old.n:0),f:p.firstListened?Date.parse(p.firstListened):0,l,s:p.sources||[]});
  v.push(b)}
 persistMeta();if(v.length)banks.push({name:'Import '+fname.replace(/\.json$/i,''),v});status(v.length+' presets importés.')}
{const jv=Object.values(meta).filter(r=>r.r||r.t.length||r.c).sort((a,b)=>b.l-a.l).map(r=>unhex(r.h));if(jv.length)banks.push({name:'Journal (annotés)',v:jv})}
let tm;const status=t=>{$('st').textContent=t;clearTimeout(tm);tm=setTimeout(()=>$('st').textContent='',6000)};
function initV(){const b=new Uint8Array(128);for(let k=0;k<6;k++)b.set([99,99,99,99,99,99,99,0,39,0,0,0,56,0,k===5?99:0,2,0],k*17);
 b.set([99,99,99,99,50,50,50,50,0,8,35,0,0,0,57,24],102);b.set([...'INIT VOICE'].map(c=>c.charCodeAt(0)),118);return b}
async function load(files){for(const f of files){const d=new Uint8Array(await f.arrayBuffer());
  if(d[0]===0x7B){importJSON(new TextDecoder().decode(d),f.name);continue}
  if(d.length>=4104&&d[0]===0xF0&&d[1]===0x43&&d[3]===9){const v=[];for(let k=0;k<32;k++)v.push(d.slice(6+k*128,6+(k+1)*128));
   banks.push({name:f.name.replace(/(\.syx|\.txt)+$/i,''),v});status(f.name+' chargé')}
  else status('Format non reconnu (banque de 32 voix DX7 attendue) : '+f.name)}drawAll()}

const pad=i=>String(i+1).padStart(2,'0');
function drawSrc(){const S=$('src'),sy=S.scrollTop;S.textContent='';
 if(!banks.length)S.append(h('div','r e','Aucune banque chargée.'));
 banks.forEach((B,bi)=>{const hd=h('div','bh');hd.append(h('span','',B.name+' ('+B.v.length+')'));
  const bt=h('button','sm','→ carte');bt.title='Remplacer la carte par cette banque (32 premières voix)';
  bt.onclick=()=>{cart=Array.from({length:32},(_,i)=>B.v[i]?B.v[i].slice():null);persist();drawCart()};
  const bx=h('button','sm','✕');bx.onclick=()=>{banks.splice(bi,1);drawSrc()};hd.append(bt,bx);S.append(hd);
  B.v.forEach((b,i)=>{const r0=meta[idOf(b)];if(!pass(r0))return;const k='s'+bi+':'+i,r=h('div','r'+(k===selKey?' sel':''));
   r.append(h('span','n',pad(i)),h('span','dot'+(r0&&r0.n?' on':''),'●'),h('span','nm',nm(b)),h('span','tg',r0&&r0.t.length?r0.t.join(' · '):''),h('span','rt',r0&&r0.r?'★'+r0.r:''));
   const a=h('button','sm','+');a.title='Ajouter à ma carte (ou Entrée)';a.onclick=e=>{e.stopPropagation();addCart(b)};r.append(a);

function drawCart(){const C=$('cart'),sy=C.scrollTop;C.textContent='';const cnt=cart.filter(Boolean).length;
 $('cn').textContent='('+cnt+'/32'+(cnt===32?' · prête à exporter':'')+')';
 cart.forEach((b,i)=>{const k='c'+i,r=h('div','r'+(k===selKey?' sel':''));r.append(h('span','n',pad(i)));
  if(!b){r.append(h('span','nm e','—'))}else{
   const inp=h('input');inp.type='text';inp.maxLength=10;inp.value=nm(b);

const held=new Map();
function drawKb(){const W=[],Bk=[];for(let n=base;n<=base+24;n++){if([1,3,6,8,10].includes(n%12))Bk.push([n,W.length]);else W.push(n)}
 const kb=$('kb');kb.textContent='';W.forEach(n=>{const k=h('div','k');k.dataset.n=n;kb.append(k)});
 Bk.forEach(([n,w])=>{const k=h('div','b k');k.dataset.n=n;k.style.left=(w/W.length*100)+'%';kb.append(k)});
 $('ol').textContent='Octave C'+(base/12-1)}

function nav(d){const ks=[];banks.forEach((B,bi)=>B.v.forEach((b,i)=>{if(pass(meta[idOf(b)]))ks.push(['s'+bi+':'+i,b])}));
 let list=selKey[0]==='c'?cart.map((b,i)=>b&&['c'+i,b]).filter(Boolean):ks;if(!list.length)return;
 let i=list.findIndex(x=>x[0]===selKey);i=i<0?0:Math.max(0,Math.min(list.length-1,i+d));pick(list[i][1],list[i][0]);

 else if(e.code==='ArrowLeft'){base=Math.max(24,base-12);drawKb()}else if(e.code==='ArrowRight'){base=Math.min(72,base+12);drawKb()}
 else if(/^(Digit|Numpad)[0-5]$/.test(e.code)){if(curB)rate(+e.code.slice(-1))}
 else if(e.code==='Enter'&&e.target.tagName!=='BUTTON'){if(curB)addCart(curB)}
 else{const i=KM.indexOf(e.code);if(i<0||e.repeat||e.metaKey||e.ctrlKey)return;const n=base+i;kd[e.code]=n;on(n,100);
  const k=document.querySelector('#kb [data-n="'+n+'"]');if(k)k.classList.add('on')}});

$('eng').onchange=e=>{if(W)W.engine_set(+e.target.value)};
(async()=>{try{const bin=Uint8Array.from(atob(WB64),c=>c.charCodeAt(0));
 const {instance}=await WebAssembly.instantiate(bin,{wasi_snapshot_preview1:{fd_close:()=>0,fd_seek:()=>0,fd_write:()=>0}});
 instance.exports.__wasm_call_ctors();WI=instance.exports;$('el').hidden=false;$('ei').textContent='Moteur : Dexed (msfa, WebAssembly)'}
 catch(err){WI=null;$('ei').textContent='WebAssembly indisponible ici : moteur JS simplifié (moins fidèle)'}})();
$('xj').onclick=async()=>{const dl=await(window.claude&&window.claude.use?window.claude.use('downloads'):null);
 if(!dl){status('Export indisponible dans ce contexte.');return}
 const ex=buildExport($('xs').value);
 try{await dl.save({filename:'bibliotheque_dx7.json',data:new TextEncoder().encode(JSON.stringify(ex,null,1))});status(ex.presets.length+' presets exportés.')}
 catch(e){status(e&&e.code==='declined'?'Export annulé.':'Export impossible ('+(e&&e.code||'erreur')+').')}};
try{$('cname').value=localStorage.getItem('dx7cname')||'Ma carte'}catch(e){}
$('cname').onchange=e=>{try{localStorage.setItem('dx7cname',e.target.value)}catch(_){}};
const cfile=()=>($('cname').value.trim()||'MaCarte').replace(/[^\w\- ]+/g,'').trim().replace(/\s+/g,'_')||'MaCarte';
/* ---------- MIDI (Web MIDI) ---------- */
const dn=new Set(),pend=new Set();let sus=false;
const kel=(n,on)=>{const k=document.querySelector('#kb [data-n="'+n+'"]');if(k)k.classList.toggle('on',on)};
function mon(n,v){dn.add(n);pend.delete(n);on(n,v);kel(n,true)}
function moff(n){dn.delete(n);kel(n,false);if(sus)pend.add(n);else off(n)}
function goto(i){const it=selKey[0]==='c'?(cart[i]&&['c'+i,cart[i]]):banks.flatMap((B,bi)=>B.v.map((b,j)=>['s'+bi+':'+j,b]))[i];if(it)pick(it[1],it[0])}
function mmsg(e){const[s,a,b]=e.data,t=s&240;
 if(t===144&&b>0)mon(a,b);else if(t===128||t===144)moff(a);
 else if(t===176){if(a===64){sus=b>=64;if(!sus){pend.forEach(n=>{if(!dn.has(n))off(n)});pend.clear()}}
  else if(a===123||a===120){dn.clear();pend.clear();if(W)W.all_off();else voices.forEach(v=>off(v.n));document.querySelectorAll('#kb .on').forEach(k=>k.classList.remove('on'))}}
 else if(t===192)goto(a)}
$('midi').onclick=async()=>{
 if(!navigator.requestMIDIAccess){status('Web MIDI indisponible dans ce navigateur (Chrome ou Edge conviennent ; Safari ne le gère pas).');return}
 try{init();const a=await navigator.requestMIDIAccess();
  const bind=()=>{const ns=[];a.inputs.forEach(i=>{i.onmidimessage=mmsg;ns.push(i.name)});$('mi').textContent=ns.length?'MIDI : '+ns.join(', '):'MIDI actif, aucun clavier détecté';$('midi').textContent='🎹 MIDI actif'};
  a.onstatechange=bind;bind()}
 catch(e){status('Accès MIDI refusé ou bloqué par la page ('+(e&&e.name||'erreur')+').')}};
drawKb();drawAll();

/* ---------- PWA : téléchargement réel, installation, hors-ligne, ouverture de fichiers ---------- */
if(!(window.claude&&window.claude.use))window.claude={use:async()=>({save:async({filename,data})=>{
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data]));a.download=filename;document.body.append(a);a.click();
 setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}})};
if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js').catch(()=>{});
let ip=null;addEventListener('beforeinstallprompt',e=>{e.preventDefault();ip=e;$('inst').hidden=false});
$('inst').onclick=()=>{if(ip){ip.prompt();ip=null;$('inst').hidden=true}};
addEventListener('appinstalled',()=>{$('inst').hidden=true});
addEventListener('click',()=>{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()},{once:true});
if('launchQueue' in window)launchQueue.setConsumer(async p=>{if(p.files&&p.files.length)load(await Promise.all(p.files.map(h=>h.getFile())))});
